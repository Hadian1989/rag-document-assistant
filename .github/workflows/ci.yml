name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # The Spring context needs a pgvector database to start
    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rag
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Dummy values: the normal tests only start the app, they never call OpenAI or Telegram
    env:
      OPENAI_API_KEY: dummy
      TELEGRAM_BOT_NAME: dummy
      TELEGRAM_BOT_TOKEN: dummy
      TELEGRAM_ADMIN_CHAT_ID: 0

    defaults:
      run:
        working-directory: telegram-chatbot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build and test (without eval)
        run: ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Create PrimeUI license file
        env:
          PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}
        run: echo "export const PRIMEUI_LICENSE = '$PRIMEUI_LICENSE';" > src/app/primeui-license.ts

      - run: npm run build