services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: rag-db
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  frontend:
    build: ../frontend
    container_name: rag-frontend
    ports:
      - "4200:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  pgdata: