spring.application.name=telegram-chatbot
server.port=8090
server.servlet.encoding.force=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
#Bot Config
bot.name=${TELEGRAM_BOT_NAME}
bot.token=${TELEGRAM_BOT_TOKEN}
bot.admin-chat-id=${TELEGRAM_ADMIN_CHAT_ID}
#Database Config
rag.db.host=localhost
rag.db.port=5432
rag.db.database=rag
rag.db.user=rag
rag.db.password=rag
rag.docs-folder=docs
#RAG config
rag.ingest-on-startup=false
#logging.level.dev.langchain4j=DEBUG
#logging.level.dev.ai4j.openai4j=DEBUG
logging.file.name=logs/app.log
rag.chunk-size=1000
rag.chunk-overlap=100
rag.max-results=3
rag.min-score=0.6