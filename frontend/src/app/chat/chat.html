<div class="flex flex-col h-full max-w-3xl mx-auto p-4 gap-4 ">
  <div #scroller class="flex-1 overflow-y-auto flex flex-col gap-4" aria-live="polite">
    @for (msg of messages(); track $index) {
      <div class="flex" [class.justify-end]="msg.role === 'user'">
        <div class="rounded-xl px-4 py-2 max-w-[80%] whitespace-pre-line"
             [class]="msg.role === 'user' ? 'bg-primary text-primary-contrast' : 'bg-surface-50 dark:bg-surface-800'">
          {{ msg.text }}
          @if (msg.sources?.length) {
            <app-source-chips [sources]="msg.sources!"/>
          }
        </div>
      </div>
    } @empty {
      <p class="text-muted-color">Stell eine Frage zu deinen Dokumenten ...</p>
    }
    @if (error()) {
      <p-message severity="error">{{ error() }}</p-message>
    }
  </div>

  <div class="flex gap-2">
  <textarea pTextarea (keydown.enter)="onEnter($event)" [(ngModel)]="question" rows="2" class="flex-1"
            placeholder="Deine Frage..."
            aria-label="Frage"></textarea>
    <button pButton [disabled]="loading()" (click)="send()">
      @if (loading()) {
        <span class="size-4 rounded-full border-2 border-current border-t-transparent animate-spin"></span>
      }
      Senden
    </button>
  </div>
</div>
