<h2 class="font-semibold mb-2"> {{ 'DOCS.LOADED' | translate: {count: store.count()} }}</h2>

@if (store.error()) {
  <p-message severity="error">{{ store.error()! | translate }}</p-message>
}

<ul class="flex flex-col gap-1">
  @for (doc of store.documents(); track doc.fileName) {
    <li class="flex justify-between gap-2 text-sm">
      <span class="truncate" [title]="doc.fileName">📄 {{ doc.fileName }}</span>
      <span class="text-muted-color shrink-0">{{ 'DOCS.PAGES' | translate: {count: doc.pages} }}</span>
    </li>
  }
</ul>
