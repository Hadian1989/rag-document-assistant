<div
  class="min-h-screen flex flex-col md:flex-row bg-surface-0 dark:bg-surface-950 text-surface-900 dark:text-surface-0">
  <aside
    class="md:w-80 shrink-0 p-4 flex flex-col gap-6 border-b md:border-b-0 md:border-r border-surface-200 dark:border-surface-700">
    <div class="flex items-center justify-between">
      <h1 class="text-xl font-bold">📚 {{ 'APP.TITLE' | translate }}</h1>
      <div class="flex gap-2">
        <button pButton [text]="true" [rounded]="true" (click)="dark.set(!dark())"
                [attr.aria-label]="'APP.TOGGLE_DARK' | translate">
          {{ dark() ? '☀️' : '🌙' }}
        </button>
        <button pButton type="button" text rounded
                (click)="lang.set(lang() === 'de' ? 'en' : 'de')"
                [attr.aria-label]="'APP.SWITCH_LANG' | translate">
          {{ lang() === 'de' ? 'EN' : 'DE' }}
        </button>
      </div>
    </div>
    <app-upload/>
    <app-document-list/>
  </aside>
  <main class="flex-1 min-w-0 md:h-screen">
    <app-chat/>
  </main>
</div>
<p-toast position="top-right" />
