<div class="flex flex-col gap-3">
  <label class="flex flex-col items-center gap-1 border-2 border-dashed rounded-xl p-6 cursor-pointer text-center"
         [class.border-primary]="dragging()"
         [class.bg-primary-50]="dragging()"
         (dragover)="onDragOver($event)"
         (dragleave)="dragging.set(false)"
         (drop)="onDrop($event)">
    <span class="font-medium">PDF hierher ziehen</span>
    <span class="text-sm text-muted-color">oder klicken zum Auswählen</span>
    <input type="file" accept="application/pdf" class="sr-only" (change)="onFileSelected($event)"/>
  </label>

  @if (progress() !== null) {
    @if (processing()) {
      <p-progressbar mode="indeterminate"/>
      <p class="text-sm text-muted-color">Wird verarbeitet …</p>
    } @else {
      <p-progressbar [value]="progress()!"/>
    }
  }

  @if (message(); as m) {
    <p-message [severity]="m.severity">{{ m.text }}</p-message>
  }
</div>
